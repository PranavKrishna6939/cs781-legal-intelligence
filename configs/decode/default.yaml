# Frozen after scripts/50_decode_sweep.py. These are the report's starting point, not a tuned result.
temperature: 0.8
truncation: min_p
min_p: 0.05
top_p: 0.9
eta: 0.003
no_repeat_ngram: 4
frequency_penalty: 0.3
frequency_window: 64
prepend_bos: true
max_new_tokens: 1024     # upper bound; stops at 128 words. Digit-heavy prompts need >400 tokens (1 digit = 1 token)
target_words: 128
mbr:
  enabled: true
  n: 16
  temperature: 0.9
  utility: mixed
  alpha: 0.5
contrastive:
  enabled: false
  k: 6
  alpha: 0.6
