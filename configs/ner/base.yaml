# Phase-2 NER defaults. The trainer reads the same numbers as flags; this file is the record.
epochs: 20
batch_size: 16
grad_accum: 1
backbone_lr: 3.0e-5
head_lr: 1.0e-3
adapter_lr: 5.0e-4
layer_decay: 0.85
warmup_fraction: 0.10
weight_decay: 0.01
grad_clip: 1.0
ema_decay: 0.999
ema_start_fraction: 0.80
lorma_rank: 16
lorma_alpha: 32
lora_rank: 16
lora_alpha: 32
adapter_bottleneck: 64
max_span: 64
header_dense: 192
body_dense: 1792
stride_dense: 1280
header_echo: 128
body_echo: 896
stride_echo: 640
empty_window_prob: 0.3
kd_temperature: 2.0
self_train_threshold: 0.9
